name: FastAPI testing action

on:
  workflow_dispatch: 
  push:
    paths: 
      - 'app/**'
  pull_request:
     paths: 'app/**'
  


jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0
        with:
          version: 0.11.28

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest
