name: Frontend testing action

on:
  push:
  #  paths: 
  #    - 'web/**'
  pull_request:
 #   paths: 'web/**'
  


jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup Node and pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}
          package-json-file: './web'

      - name: Run vitest tests
        run: pnpm test
