name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup Node and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.8.0
          runtime: node@{{ matrix.node-version }}

      - name: Run vitest tests
        run: pnpm test
